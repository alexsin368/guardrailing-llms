# Default values for guardrailing-llms.

# Namespace will be automatically set by Helm to {{ .Release.Namespace }}

# User-customizable configuration
device: "gpu"  # Options: ["gpu", "cpu", "hpu"]

# Device-specific annotations
annotations:
  gpu:
    detectorsRecommendedAccelerators:
      - "nvidia.com/gpu"
    inferenceServiceLlmDisplayName: "Llama 3.2 3b Instruct"
  cpu:
    detectorsRecommendedAccelerators:
      - "cpu"
    inferenceServiceLlmDisplayName: "Llama 3.2 3b Instruct CPU"
  hpu:
    detectorsRecommendedAccelerators:
      - "habana.ai/gaudi"
    inferenceServiceLlmDisplayName: "Llama 3.2 3b Instruct HPU"

# Device-specific inference service LLM variables
inferenceServiceLlm:
  common:
    env:
      HF_HOME: "/root/.cache/huggingface"
      VLLM_CACHE_DIR: "/tmp/vllm_cache"
      XDG_CACHE_HOME: "/tmp/.cache"
  gpu:
    env:
      CUDA_VISIBLE_DEVICES: "0"
    resources:
      limits:
        cpu: "8"
        memory: 10Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"
  cpu:
    env:
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
      VLLM_CPU_SGL_KERNEL: "1"
      HF_HUB_DISABLE_XET: "1"
    resources:
      limits:
        cpu: "16"
        memory: "64Gi"
      requests:
        cpu: "8"
        memory: "32Gi"
  hpu:
    env:
      runtime: "habana"
      HABANA_VISIBLE_DEVICES: "all"
      EXPERIMENTAL_WEIGHT_SHARING: "0"
      PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
      PT_HPU_LAZY_MODE: "1"
      VLLM_DECODE_BLOCK_BUCKET_MAX: "66048"
      VLLM_DECODE_BLOCK_BUCKET_STEP: "256"
      VLLM_DECODE_BS_BUCKET_STEP: "32"
      VLLM_DELAYED_SAMPLING: "true"
      VLLM_EXPONENTIAL_BUCKETING: "false"
      VLLM_GRAPH_PROMPT_RATIO: "0.5"
      VLLM_GRAPH_RESERVED_MEM: "0.09"
      VLLM_PROMPT_BS_BUCKET_STEP: "32"
      VLLM_PROMPT_SEQ_BUCKET_MAX: "33024"
      VLLM_PROMPT_SEQ_BUCKET_STEP: "256"
      VLLM_PROMPT_USE_FUSEDSDPA: "1"
      HF_HUB_DISABLE_XET: "1"
      VLLM_SKIP_WARMUP: "false"
    resources:
      limits:
        cpu: "6"
        memory: 16Gi
        habana.ai/gaudi: "1"
      requests:
        cpu: "4"
        memory: 8Gi
        habana.ai/gaudi: "1"

# Device-specific serving runtime LLM variables
servingRuntimeLlm:
  common:
    args:
      - --port=8080
      - --model=/mnt/models
      - --served-model-name=llama3-2-3b-instruct
      - --enable-auto-tool-choice
      - --tool-call-parser=llama3_json
      - --chat-template=/app/data/template/tool_chat_template_llama3.2_json.jinja
  gpu:
    args:
      - --enable-chunked-prefill
      - --max-model-len=32768
      - --max-num-seqs=8
    command:
      - python
      - "-m"
      - vllm.entrypoints.openai.api_server
  cpu:
    args:
      - --block-size=128
      - --dtype=bfloat16
      - --max-model-len=8192
      - --distributed-executor-backend=mp
      - --enable-chunked-prefill
      - --enforce-eager
      - --max-num-batched-tokens=2048
      - --max-num-seqs=256
      - --tensor-parallel-size=1
      - --pipeline-parallel-size=1
    command:
      - vllm
      - serve
  hpu:
    args:
      - --block-size=128
      - --dtype=bfloat16
      - --max-model-len=33024
      - --gpu-memory-util=0.99
      - --max-num-seqs=256
      - --max-num-prefill-seqs=16
      - --num-scheduler-steps=1
      - --use-padding-aware-scheduling
      - --tensor-parallel-size=1
    command:
      - python
      - "-m"
      - vllm.entrypoints.openai.api_server

# Main LLM
mainLLM:
  storageUri: "oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-3b-instruct"
  port: 8080
  gpu:
    name: llama-32-3b-instruct
    image: "quay.io/modh/vllm@sha256:db766445a1e3455e1bf7d16b008f8946fcbe9f277377af7abb81ae358805e7e2"
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "True"
        effect: NoSchedule
  cpu:
    name: llama-32-3b-instruct-cpu
    image: "opea/vllm-cpu-ubi:v0.12.0-ubi9"
    tolerations: []
  hpu:
    name: llama-32-3b-instruct-hpu
    image: "quay.io/modh/vllm:rhoai-2.25-gaudi"
    tolerations:
      - key: habana.ai/gaudi
        operator: Equal
        value: "True"
        effect: NoSchedule

# Detectors
detectors:
  gibberish:
    storageUri: "oci://quay.io/mmurakam/model-cars:gibberish-text-detector-v0.1.1"
    threshold: 0.35
    port: 8000
  promptInjection:
    storageUri: "oci://quay.io/mmurakam/model-cars:deberta-v3-base-prompt-injection-v2-v0.1.0"
    threshold: 0.5
    port: 8000
  hateAndProfanity:
    storageUri: "oci://quay.io/mmurakam/model-cars:granite-guardian-hap-38m-v0.1.0"
    threshold: 0.5
    port: 8000
  regex:
    port: 8080

# Orchestrator
orchestrator:
  replicas: 1
  port: 8032

# Workbench configuration
workbench:
  enabled: true
  name: guardrails-workbench
  image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-minimal-notebook:2025.1
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      cpu: "2"
      memory: 8Gi
  storage:
    size: 1Gi
  gitRepo:
    url: https://github.com/rh-ai-quickstart/guardrailing-llms.git
    enabled: true

# Cluster configuration
clusterdomainurl: cluster.example.com
