---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    openshift.io/display-name: "{{ index .Values.annotations .Values.device "inferenceServiceLlmDisplayName" }}"
    serving.kserve.io/deploymentMode: RawDeployment
  name: "{{ index .Values.mainLLM .Values.device "name" }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    {{- if eq .Values.device "hpu" }}
    initContainers:
      - name: vllm-autocalc-init
        image: '{{ index .Values.mainLLM.hpu "image" }}'
        command:
          - sh
          - -c
          - |
            set -e
            
            echo "=== Starting vLLM Gaudi init container ==="
            cd /tmp
            
            # Git clone with timeout
            echo "Cloning vllm-gaudi repository with 10 minute timeout..."
            timeout 600 git clone --depth 1 https://github.com/vllm-project/vllm-gaudi.git || {
              echo "ERROR: Failed to clone repository"
              exit 1
            }
            
            # Execute the autocalc script from ConfigMap
            echo "Executing autocalc script..."
            export VLLM_GAUDI_PATH=/tmp/vllm-gaudi

            if [ ! -f /scripts/vllm-gaudi-autocalc.sh ]; then
              echo "ERROR: autocalc script not found at /scripts/vllm-gaudi-autocalc.sh"
              exit 1
            fi
            
            /scripts/vllm-gaudi-autocalc.sh /tmp/vllm-gaudi || {
              echo "ERROR: autocalc script failed"
              exit 1
            }
            
            # Verify output files were created
            if [ ! -f /config/vllm_autocalc_output.txt ]; then
              echo "ERROR: vllm_autocalc_output.txt was not created"
              exit 1
            fi
            
            if [ ! -f /config/env_vars.txt ]; then
              echo "ERROR: env_vars.txt was not created"
              exit 1
            fi
            
            echo "=== Init container completed successfully ==="
            echo "Generated vLLM arguments:"
            cat /config/vllm_autocalc_output.txt
            echo ""
            echo "Generated environment variables:"
            cat /config/env_vars.txt
        env:
          - name: HF_HOME
            value: "/tmp/hf_home"
          - name: MODEL
            value: "{{ .Values.mainLLM.model }}"
        volumeMounts:
          - mountPath: /config
            name: generated-config
            readOnly: false
          - mountPath: /scripts
            name: autocalc-script
            readOnly: true
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            habana.ai/gaudi: '1'
          limits:
            cpu: '4'
            memory: 8Gi
            habana.ai/gaudi: '1'
    {{- end }}
    model:
      modelFormat:
        name: vLLM
      name: ""
      env:
        {{- range $name, $value := .Values.inferenceServiceLlm.common.env }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $name, $value := index .Values.inferenceServiceLlm .Values.device "env" }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
      resources:
        {{- toYaml (index .Values.inferenceServiceLlm .Values.device "resources") | nindent 8 }}
      runtime: "{{ index .Values.mainLLM .Values.device "name" }}"
      storageUri: "{{ .Values.mainLLM.storageUri }}"
      {{- if hasKey (index .Values.inferenceServiceLlm .Values.device) "volumeMounts" }}
      volumeMounts:
        {{- toYaml (index .Values.inferenceServiceLlm .Values.device "volumeMounts") | nindent 8 }}
      {{- end }}
  {{- if hasKey (index .Values.inferenceServiceLlm .Values.device) "volumes" }}
  volumes:
    {{- toYaml (index .Values.inferenceServiceLlm .Values.device "volumes") | nindent 4 }}
  {{- end }}