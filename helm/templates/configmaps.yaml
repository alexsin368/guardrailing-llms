---
kind: ConfigMap
apiVersion: v1
metadata:
  name: fms-orchestr8-config-nlp
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    openai:
      service:
        hostname: {{ index .Values.mainLLM .Values.device "name" }}-predictor.{{ .Release.Namespace }}.svc.cluster.local
        port: {{ .Values.mainLLM.port }}
    detectors:
      regex:
        type: text_contents
        service:
            hostname: "127.0.0.1"
            port: {{ .Values.detectors.regex.port }}
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: ibm-hate-and-profanity-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.hateAndProfanity.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.hateAndProfanity.threshold }}
      prompt_injection:
        type: text_contents
        service:
          hostname: prompt-injection-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.promptInjection.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.promptInjection.threshold }}
      gibberish:
        type: text_contents
        service:
          hostname: gibberish-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.gibberish.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.gibberish.threshold }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: gorch-regex-gateway-image-config
  namespace: {{ .Release.Namespace }}
data:
  GatewayImage: 'quay.io/repository/trustyai/vllm-orchestrator-gateway@sha256:c511b386d61a728acdfe8a1ac7a16b3774d072dd053718e5b9c5fab0f025ac3b'
  regexDetectorImage: 'quay.io/repository/trustyai/regex-detector@sha256:efab6cd8b637b9c35d311aaf639dfedee7d28de3ee07b412ab473deadecd3606'
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: fms-orchestr8-config-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: fmstack-nlp
data:
  config.yaml: |
    orchestrator:   
      host: "localhost"
      port: {{ .Values.orchestrator.port }}
    detectors:      
      - name: regex
        input: true 
        output: true
        detector_params:
          regex:
            - email
            - ssn
      - name: hap
        input: true
        output: true
        detector_params: {}
      - name: prompt_injection
        input: true
        output: false
        detector_params: {}
      - name: gibberish
        input: true
        output: true
        detector_params: {}
    routes:         
      - name: all
        detectors:
          - regex
          - hap
          - prompt_injection
          - gibberish
      - name: passthrough
        detectors:
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: chat-template
data:
  tool_chat_template_llama3.2_json.jinja: |
    {{`{{- bos_token }}`}}
    {{`    {%- if custom_tools is defined %}`}}
    {{`        {%- set tools = custom_tools %}`}}
    {{`    {%- endif %}`}}
    {{`    {%- if not tools_in_user_message is defined %}`}}
    {{`        {%- set tools_in_user_message = false %}`}}
    {{`    {%- endif %}`}}
    {{`    {%- if not date_string is defined %}`}}
    {{`        {%- if strftime_now is defined %}`}}
    {{`            {%- set date_string = strftime_now("%d %b %Y") %}`}}
    {{`        {%- else %}`}}
    {{`            {%- set date_string = "26 Jul 2024" %}`}}
    {{`        {%- endif %}`}}
    {{`    {%- endif %}`}}
    {{`    {%- if not tools is defined %}`}}
    {{`        {%- set tools = none %}`}}
    {{`    {%- endif %}`}}

    {{`    {#- Find out if there are any images #}`}}
    {{`    {% set image_ns = namespace(has_images=false) %}`}}
    {{`    {%- for message in messages %}`}}
    {{`        {%- for content in message['content'] %}`}}
    {{`            {%- if content['type'] == 'image' %}`}}
    {{`                {%- set image_ns.has_images = true %}`}}
    {{`            {%- endif %}`}}
    {{`        {%- endfor %}`}}
    {{`    {%- endfor %}`}}

    {{`    {#- This block extracts the system message, so we can slot it into the right place. #}`}}
    {{`    {%- if messages[0]['role'] == 'system' %}`}}
    {{`        {%- if messages[0]['content'] is string %}`}}
    {{`            {%- set system_message = messages[0]['content']|trim %}`}}
    {{`        {%- else %}`}}
    {{`            {%- set system_message = messages[0]['content'][0]['text']|trim %}`}}
    {{`        {%- endif %}`}}
    {{`        {%- set messages = messages[1:] %}`}}
    {{`    {%- else %}`}}
    {{`        {%- if tools is not none %}`}}
    {{`            {%- set system_message = "You are a helpful assistant with tool calling capabilities. Only reply with a tool call if the function exists in the library provided by the user. If it doesn't exist, just reply directly in natural language. When you receive a tool call response, use the output to format an answer to the original user question." %}`}}
    {{`        {%- else %}`}}
    {{`            {%- set system_message = "" %}`}}
    {{`        {%- endif %}`}}
    {{`    {%- endif %}`}}

    {{`    {#- System message if there are no images, if the user supplied one, or if tools are used (default tool system message) #}`}}
    {{`    {%- if system_message or not image_ns.has_images %}`}}
    {{`        {{- "<|start_header_id|>system<|end_header_id|>\n\n" }}`}}
    {{`        {%- if tools is not none %}`}}
    {{`            {{- "Environment: ipython\n" }}`}}
    {{`        {%- endif %}`}}
    {{`        {{- "Cutting Knowledge Date: December 2023\n" }}`}}
    {{`        {{- "Today Date: " + date_string + "\n\n" }}`}}
    {{`        {%- if tools is not none and not tools_in_user_message %}`}}
    {{`            {{- "You have access to the following functions. To call a function, please respond with JSON for a function call. " }}`}}
    {{`            {{- 'Respond in the format {"name": function name, "parameters": dictionary of argument name and its value}. ' }}`}}
    {{`            {{- "Do not use variables.\n\n" }}`}}
    {{`            {%- for t in tools %}`}}
    {{`                {{- t | tojson(indent=4) }}`}}
    {{`                {{- "\n\n" }}`}}
    {{`            {%- endfor %}`}}
    {{`        {%- endif %}`}}
    {{`        {{- system_message }}`}}
    {{`        {{- "<|eot_id|>" }}`}}
    {{`    {%- endif %}`}}

    {{`    {#- Custom tools are passed in a user message with some extra guidance #}`}}
    {{`    {%- if tools_in_user_message and not tools is none %}`}}
    {{`        {#- Extract the first user message so we can plug it in here #}`}}
    {{`        {%- if messages | length != 0 %}`}}
    {{`            {%- if messages[0]['content'] is string %}`}}
    {{`                {%- set first_user_message = messages[0]['content']|trim %}`}}
    {{`            {%- else %}`}}
    {{`                {%- set first_user_message = messages[0]['content'] | selectattr('type', 'equalto', 'text') | map(attribute='text') | map('trim') | join('\n') %}`}}
    {{`            {%- endif %}`}}
    {{`            {%- set messages = messages[1:] %}`}}
    {{`        {%- else %}`}}
    {{`            {{- raise_exception("Cannot put tools in the first user message when there's no first user message!") }}`}}
    {{`        {%- endif %}`}}
    {{`        {{- '<|start_header_id|>user<|end_header_id|>\n\n' -}}`}}
    {{`        {{- "Given the following functions, please respond with a JSON for a function call " }}`}}
    {{`        {{- "with its proper arguments that best answers the given prompt.\n\n" }}`}}
    {{`        {{- 'Respond in the format {"name": function name, "parameters": dictionary of argument name and its value}. ' }}`}}
    {{`        {{- "Do not use variables.\n\n" }}`}}
    {{`        {%- for t in tools %}`}}
    {{`            {{- t | tojson(indent=4) }}`}}
    {{`            {{- "\n\n" }}`}}
    {{`        {%- endfor %}`}}
    {{`        {{- first_user_message + "<|eot_id|>" }}`}}
    {{`    {%- endif %}`}}

    {{`    {%- for message in messages %}`}}
    {{`        {%- if not (message.role == 'ipython' or message.role == 'tool' or 'tool_calls' in message) %}`}}
    {{`            {{- '<|start_header_id|>' + message['role'] + '<|end_header_id|>\n\n' }}`}}
    {{`            {%- if message['content'] is string %}`}}
    {{`                {{- message['content'] | trim}}`}}
    {{`            {%- else %}`}}
    {{`                {%- for content in message['content'] %}`}}
    {{`                    {%- if content['type'] == 'image' %}`}}
    {{`                        {{- '<|image|>' }}`}}
    {{`                    {%- elif content['type'] == 'text' %}`}}
    {{`                        {{- content['text'] | trim }}`}}
    {{`                    {%- endif %}`}}
    {{`                {%- endfor %}`}}
    {{`            {%- endif %}`}}
    {{`            {{- '<|eot_id|>' }}`}}
    {{`        {%- elif 'tool_calls' in message %}`}}
    {{`            {%- if not message.tool_calls|length == 1 %}`}}
    {{`                {{- raise_exception("This model only supports single tool-calls at once!") }}`}}
    {{`            {%- endif %}`}}
    {{`            {%- set tool_call = message.tool_calls[0].function %}`}}
    {{`            {{- '<|start_header_id|>assistant<|end_header_id|>\n\n' -}}`}}
    {{`            {{- '{"name": "' + tool_call.name + '", ' }}`}}
    {{`            {{- '"parameters": ' }}`}}
    {{`            {{- tool_call.arguments | tojson }}`}}
    {{`            {{- "}" }}`}}
    {{`            {{- "<|eot_id|>" }}`}}
    {{`        {%- elif message.role == "tool" or message.role == "ipython" %}`}}
    {{`            {{- "<|start_header_id|>ipython<|end_header_id|>\n\n" }}`}}
    {{`            {%- if message.content is string %}`}}
    {{`                {{- { "output": message.content } | tojson }}`}}
    {{`            {%- else %}`}}
    {{`                {%- for content in message['content']  %}`}}
    {{`                    {%- if content['type']  == 'text' %}`}}
    {{`                        {{- { "output": content['text']  } | tojson }}`}}
    {{`                    {%- endif %}`}}
    {{`                {%- endfor %}`}}
    {{`            {%- endif %}`}}
    {{`            {{- "<|eot_id|>" }}`}}
    {{`        {%- endif %}`}}
    {{`    {%- endfor %}`}}
    {{`    {%- if add_generation_prompt %}`}}
    {{`        {{- '<|start_header_id|>assistant<|end_header_id|>\n\n' }}`}}
    {{`    {%- endif %}`}}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: vllm-gaudi-autocalc-script
data:
  vllm-gaudi-autocalc.sh: |
    #!/bin/bash

    set -e

    # Set paths
    VLLM_GAUDI_PATH="${1:-.}"
    VLLM_ARGS_OUTPUT="${2:-/config/vllm_autocalc_output.txt}"
    ENV_VARS_OUTPUT="${3:-/config/env_vars.txt}"
    
    # Export for Python subprocess
    export VLLM_ARGS_OUTPUT
    export ENV_VARS_OUTPUT
    
    echo "Starting vLLM autocalc initialization..."
    echo "VLLM_GAUDI_PATH: $VLLM_GAUDI_PATH"
    echo "VLLM_ARGS_OUTPUT: $VLLM_ARGS_OUTPUT"
    echo "ENV_VARS_OUTPUT: $ENV_VARS_OUTPUT"
    
    if [ ! -d "$VLLM_GAUDI_PATH" ]; then
        echo "ERROR: VLLM_GAUDI_PATH directory not found: $VLLM_GAUDI_PATH"
        exit 1
    fi
    
    if [ ! -d "$VLLM_GAUDI_PATH/.cd/server" ]; then
        echo "ERROR: .cd/server directory not found in $VLLM_GAUDI_PATH"
        exit 1
    fi

    cd "${VLLM_GAUDI_PATH}/.cd/server"

    python << 'PYTHON_EOF'
    import sys
    import os
    vllm_gaudi_path = os.environ.get('VLLM_GAUDI_PATH', '/tmp/vllm-gaudi')
    sys.path.insert(0, os.path.join(vllm_gaudi_path, '.cd'))
    
    from server.vllm_autocalc import VarsGenerator

    # Initialize with absolute file paths
    vars_gen = VarsGenerator(
        defaults_path=f"{os.environ.get('VLLM_GAUDI_PATH', '/tmp/vllm-gaudi')}/.cd/server/server_defaults.yaml",
        varlist_conf_path=f"{os.environ.get('VLLM_GAUDI_PATH', '/tmp/vllm-gaudi')}/.cd/server/server_user.env",
        model_def_settings_path=f"{os.environ.get('VLLM_GAUDI_PATH', '/tmp/vllm-gaudi')}/.cd/server/settings_vllm.csv"
    )

    # Calculate and get variables
    context = vars_gen.calculate_variables()

    # Override or set specific values
    context['MAX_NUM_BATCHED_TOKENS'] = max(context['MAX_NUM_BATCHED_TOKENS'], context['MAX_MODEL_LEN'])

    print("=== ALL GENERATED VARIABLES ===")
    for key, value in sorted(context.items()):
        print(f"{key}: {value} (type: {type(value).__name__})")
    print("================================")

    # vLLM api_server recognized arguments (lowercase with hyphens)
    vllm_args = {
        'block-size', 'dtype', 'max-model-len', 'gpu-memory-utilization', 'max-num-seqs',
        'max-num-prefill-seqs', 'num-scheduler-steps', 'use-padding-aware-scheduling',
        'tensor-parallel-size', 'max-num-batched-tokens'
    }

    args_list = []
    env_vars = {}

    for key, value in context.items():
        # Convert to lowercase and replace underscores with hyphens
        arg_key = key.lower().replace('_', '-')
        
        # Skip complex types and None values
        if isinstance(value, (dict, list)) or value is None:
            continue
        
        # Check if it should be a vLLM argument
        if arg_key in vllm_args:
            if isinstance(value, bool):
                if value:
                    args_list.append(f'--{arg_key}')
            else:
                args_list.append(f'--{arg_key}={value}')
        # Everything else: store as environment variable (uppercase original key)
        else:
            if not isinstance(value, (dict, list)):
                env_vars[key] = str(value)

    # Get output paths from environment variables (set by bash wrapper)
    vllm_args_output = os.environ.get('VLLM_ARGS_OUTPUT', '/config/vllm_autocalc_output.txt')
    env_vars_output = os.environ.get('ENV_VARS_OUTPUT', '/config/env_vars.txt')

    with open(vllm_args_output, 'w') as f:
        f.write(' '.join(args_list))

    with open(env_vars_output, 'w') as f:
        for k, v in env_vars.items():
            f.write(f"export {k}={v}\n")

    print(f"\n=== vLLM ARGS ===")
    print(f"Generated vLLM args: {' '.join(args_list)}")
    print(f"\n=== ENV VARS ===")
    for k, v in env_vars.items():
        print(f"{k}={v}")
    PYTHON_EOF

    echo "vLLM autocalc initialization completed successfully"